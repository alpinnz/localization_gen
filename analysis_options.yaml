include: package:lints/recommended.yaml

# Localization Gen - Analysis Options
# Comprehensive linting rules for maintainability and consistency
# https://dart.dev/guides/language/analysis-options

formatter:
  page_width: 160

analyzer:
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false

  errors:
    # Treat missing required parameters as errors
    missing_required_param: error
    # Treat missing return values as errors
    missing_return: error
    # Treat invalid assignments as errors
    invalid_assignment: error
    # Treat TODOs as info (not warnings)
    todo: info
    # Treat deprecated member use as warnings
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: ignore

  exclude:
    # Generated files
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gen.dart"
    # Build artifacts
    - "**/generated/**"
    - "build/**"
    # Examples are separate Flutter apps and include generated artifacts.
    - "example/**"

linter:
  rules:
    - dangling_library_doc_comments: false
    - prefer_interpolation_to_compose_strings: false
    - unnecessary_string_escapes: false
    - library_private_types_in_public_api: false
    - non_constant_identifier_names: false
